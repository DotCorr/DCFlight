name: dcflight
description: "Build Native App UIs with Dart – flutter_zero runtime, no Google Flutter dependency."
version: 0.0.2
homepage: https://github.com/Dotcorr/dcflight
repository: https://github.com/Dotcorr/dcflight

environment:
  sdk: ^3.6.1
  # flutter_zero is still built with the flutter tool, so we keep the SDK
  # constraint. The engine binary is DotCorr/flutter_zero.
  flutter: ">=1.17.0"

dependencies:
  # framework dependencies – no package:flutter anywhere below this line
  equatable: ^2.0.7
  logger: ^2.6.2
  ffi: ^2.1.0
  jni: ^0.15.2
  worker_manager:
    git:
      url: https://github.com/presence-app/worker_manager.git
      ref: master

  # Note: dcflight does NOT depend on dcf_primitives
  # The primitives are a separate plugin that depends on dcflight

dev_dependencies:
  flutter_lints: ^5.0.0
  ffigen: ^10.0.0
  jnigen: ^0.8.0

# flutter_zero: the plugin registration is handled through the engine's native
# asset system, not Flutter's plugin protocol. The flutter: section below only
# remains for tooling compatibility (flutter pub get, flutter build, etc.).
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DCFAppDelegate
      android:
        package: com.dotcorr.dcflight
        pluginClass: DcflightPlugin
