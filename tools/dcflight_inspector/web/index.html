<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DCFlight Inspector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-mark">DC</span>
        <span class="logo-text">Flight Inspector</span>
        <span class="badge">ALPHA</span>
      </div>
      <div class="header-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">—</span>
      </div>
      <div class="header-actions">
        <button id="btn-refresh-devices" class="btn btn-sm">Refresh</button>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-dual" checked />
          Dual view
        </label>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <section class="section">
        <h2 class="section-title">Devices</h2>
        <div id="device-list" class="device-list">
          <p class="empty-state">Loading…</p>
        </div>
        <p class="hint">Click = primary &nbsp;·&nbsp; Alt+Click = secondary</p>
      </section>

      <section class="section" id="quick-actions" style="display:none">
        <h2 class="section-title">Controls</h2>
        <div class="action-row">
          <button class="btn btn-sm btn-flex" id="btn-screenshot">Screenshot</button>
          <button class="btn btn-sm btn-flex" id="btn-home">Home</button>
          <button class="btn btn-sm btn-flex" id="btn-back">Back</button>
        </div>

        <div class="form-group">
          <label class="label">Bundle / Package ID</label>
          <div class="input-row">
            <input type="text" id="input-bundle" class="input" placeholder="com.dotcorr.dcfGo" />
            <button class="btn btn-sm" id="btn-launch">Go</button>
          </div>
          <div id="recent-bundles" class="recent-list"></div>
        </div>

        <div class="form-group">
          <label class="label">Type text</label>
          <div class="input-row">
            <input type="text" id="input-type" class="input" placeholder="Text to type…" />
            <button class="btn btn-sm" id="btn-type">→</button>
          </div>
        </div>

        <div class="form-group">
          <label class="label">Tap (x, y)</label>
          <div class="input-row">
            <input type="number" id="input-tap-x" class="input" placeholder="X" style="max-width:72px" />
            <input type="number" id="input-tap-y" class="input" placeholder="Y" style="max-width:72px" />
            <button class="btn btn-sm" id="btn-tap">Tap</button>
          </div>
        </div>

        <div class="form-group">
          <label class="label">Swipe</label>
          <div class="swipe-row">
            <input type="number" id="sw-x1" class="input" placeholder="x1" style="max-width:54px" />
            <input type="number" id="sw-y1" class="input" placeholder="y1" style="max-width:54px" />
            <span class="arrow">→</span>
            <input type="number" id="sw-x2" class="input" placeholder="x2" style="max-width:54px" />
            <input type="number" id="sw-y2" class="input" placeholder="y2" style="max-width:54px" />
            <button class="btn btn-sm" id="btn-swipe">Go</button>
          </div>
        </div>

        <div class="form-group">
          <label class="label">Auto-screenshot</label>
          <div class="input-row">
            <select id="sel-interval" class="input" style="max-width:80px; font-size:11px">
              <option value="0">Off</option>
              <option value="2000">2s</option>
              <option value="3000" selected>3s</option>
              <option value="5000">5s</option>
            </select>
            <button class="btn btn-sm" id="btn-auto-toggle" data-active="false">Start</button>
          </div>
        </div>
      </section>
    </aside>

    <!-- Dual screenshot panels -->
    <main class="screens-area" id="screens-area">
      <div class="device-panel" id="panel-primary">
        <div class="panel-header">
          <span class="panel-label primary-dot">PRIMARY</span>
          <span class="panel-device-name" id="primary-name">no device</span>
          <label class="checkbox-label-sm">
            <input type="checkbox" id="chk-tap-primary" />
            click=tap
          </label>
        </div>
        <div class="ss-box" id="ss-box-primary">
          <div class="ss-placeholder">Select a device</div>
          <img id="ss-img-primary" class="ss-img" style="display:none" alt="Primary device" />
          <canvas id="tap-canvas-primary" class="tap-canvas"></canvas>
        </div>
        <div class="panel-footer" id="pf-primary">—</div>
      </div>

      <div class="panel-divider"></div>

      <div class="device-panel" id="panel-secondary">
        <div class="panel-header">
          <span class="panel-label secondary-dot">SECONDARY</span>
          <span class="panel-device-name" id="secondary-name">no device</span>
          <label class="checkbox-label-sm">
            <input type="checkbox" id="chk-tap-secondary" />
            click=tap
          </label>
        </div>
        <div class="ss-box" id="ss-box-secondary">
          <div class="ss-placeholder">Alt+click a device to set secondary</div>
          <img id="ss-img-secondary" class="ss-img" style="display:none" alt="Secondary device" />
          <canvas id="tap-canvas-secondary" class="tap-canvas"></canvas>
        </div>
        <div class="panel-footer" id="pf-secondary">—</div>
      </div>
    </main>

    <!-- Log panel -->
    <aside class="log-panel">
      <div class="log-header">
        <h2 class="section-title">Logs</h2>
        <div class="log-controls">
          <button class="btn btn-xs" id="btn-logs-stream">Stream</button>
          <button class="btn btn-xs" id="btn-logs-stop">Stop</button>
          <button class="btn btn-xs" id="btn-logs-clear">Clear</button>
        </div>
      </div>
      <input type="text" id="log-filter" class="input log-filter-input" placeholder="Filter…" />
      <div id="log-output" class="log-output"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
